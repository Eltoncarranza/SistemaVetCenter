<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCenter - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(225, 245, 238, 0.85), rgba(225, 245, 238, 0.85)),
            url('https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo-icon { color: #198754; font-size: 40px; margin-bottom: 10px; }
        .title { color: #198754; font-weight: bold; margin-bottom: 5px; }
        .subtitle { color: #6c757d; font-size: 14px; margin-bottom: 30px; }

        .input-group-text { background-color: white; border-right: none; color: #6c757d; }
        .form-control { border-left: none; padding-left: 0; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        .input-group:focus-within { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); border-radius: 0.375rem; }
        .input-group:focus-within .input-group-text, .input-group:focus-within .form-control { border-color: #198754; }

        .btn-custom { background-color: #198754; color: white; border-radius: 10px; padding: 12px; font-weight: bold; border: none; }
        .btn-custom:hover { background-color: #146c43; color: white; }
        .link-custom { color: #198754; text-decoration: none; font-weight: bold; font-size: 14px;}
        .link-custom:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-icon"><i class="fa-solid fa-paw"></i></div>
    <h2 class="title">VetCenter</h2>
    <p class="subtitle">El bienestar de tu mascota comienza aquí.</p>

    <div class="text-start mb-4">
        <h4 class="fw-bold">Bienvenido de nuevo</h4>
        <p class="text-muted" style="font-size: 13px;">Inicia sesión para gestionar tus mascotas, consultar sus atenciones y reservar citas.</p>
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label text-muted" style="font-size: 13px;">Correo electrónico</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" id="login_email" placeholder="correo@ejemplo.com" required>
            </div>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label text-muted" style="font-size: 13px;">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="login_password" placeholder="Ingresa tu contraseña" required>
                <span class="input-group-text" style="border-left: none; cursor: pointer;" onclick="togglePassword('login_password', this)">
                        <i class="fa-regular fa-eye"></i>
                    </span>
            </div>
        </div>

        <button type="submit" class="btn btn-custom w-100 mb-3">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Iniciar sesión
        </button>
    </form>

    <p class="text-muted" style="font-size: 14px;">¿Todavía no tienes una cuenta? <a href="registro.html" class="link-custom">Regístrate aquí</a></p>
    <p class="text-muted mt-4" style="font-size: 12px;"><i class="fa-solid fa-shield-halved"></i> Acceso seguro a tu cuenta VetCenter</p>

    <div id="mensaje" class="mt-2 fw-bold"></div>
</div>

<script>
    const API_URL = "http://localhost:8080/api";

    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconElement.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
        } else {
            input.type = "password";
            iconElement.innerHTML = '<i class="fa-regular fa-eye"></i>';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login_email').value;
        const password = document.getElementById('login_password').value;
        const mensajeDiv = document.getElementById('mensaje');

        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                mensajeDiv.innerHTML = `<span class="text-success">${data.mensaje}</span>`;

                // GUARDAMOS LOS DATOS BÁSICOS
                localStorage.setItem('vetcenter_nombre', data.nombre);
                localStorage.setItem('vetcenter_rol', data.rol);
                localStorage.setItem('vetcenter_email', email);

                // TRUCO DEFINITIVO: Si es CLIENTE, buscamos su ID real usando su correo
                if (data.rol === 'CLIENTE') {
                    const resClientes = await fetch(`${API_URL}/clientes`);
                    const clientes = await resClientes.json();
                    const miPerfil = clientes.find(c => c.email === email);

                    if (miPerfil) {
                        localStorage.setItem('vetcenter_clienteId', miPerfil.id);
                    } else {
                        // Si no tiene perfil, ponemos 1 por defecto para que no falle
                        localStorage.setItem('vetcenter_clienteId', 1);
                    }
                }

                setTimeout(() => {
                    if (data.rol === 'ADMIN') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'cliente.html';
                    }
                }, 1000);

            } else {
                mensajeDiv.innerHTML = `<span class="text-danger">Credenciales incorrectas</span>`;
            }
        } catch (error) {
            mensajeDiv.innerHTML = `<span class="text-danger">Error de conexión con el servidor.</span>`;
        }
    });
</script>
</body>
</html>
