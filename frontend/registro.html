<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCenter - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(225, 245, 238, 0.85), rgba(225, 245, 238, 0.85)),
            url('https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .register-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .logo-icon { color: #198754; font-size: 40px; margin-bottom: 10px; }
        .title { color: #198754; font-weight: bold; margin-bottom: 5px; }
        .subtitle { color: #6c757d; font-size: 14px; margin-bottom: 20px; }

        .input-group-text { background-color: white; border-right: none; color: #6c757d; }
        .form-control { border-left: none; padding-left: 0; font-size: 14px; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        .input-group:focus-within { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); border-radius: 0.375rem; }
        .input-group:focus-within .input-group-text, .input-group:focus-within .form-control { border-color: #198754; }

        .btn-custom {
            background-color: #198754;
            color: white;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            border: none;
        }
        .btn-custom:hover { background-color: #146c43; color: white; }
        .link-custom { color: #198754; text-decoration: none; font-weight: bold; font-size: 14px;}
        .link-custom:hover { text-decoration: underline; }
        .form-label { font-size: 13px; color: #6c757d; margin-bottom: 5px;}
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo-icon"><i class="fa-solid fa-paw"></i></div>
    <h2 class="title">VetCenter</h2>
    <p class="subtitle">El bienestar de tu mascota comienza aquí.</p>

    <div class="text-start mb-4">
        <h4 class="fw-bold">Crear una cuenta</h4>
        <p class="text-muted" style="font-size: 13px;">Únete a VetCenter para gestionar tus mascotas y reservar citas veterinarias fácilmente.</p>
    </div>

    <form id="registroForm">
        <div class="row mb-3">
            <div class="col-md-6 text-start">
                <label class="form-label">Nombres</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                    <input type="text" class="form-control" id="reg_nombre" placeholder="Tus nombres" required>
                </div>
            </div>
            <div class="col-md-6 text-start">
                <label class="form-label">DNI</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-regular fa-id-card"></i></span>
                    <input type="text" class="form-control" id="reg_dni" placeholder="8 dígitos" maxlength="8" required>
                </div>
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" id="reg_email" placeholder="correo@ejemplo.com" required>
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="reg_password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
        </div>

        <!-- Campo oculto para el rol por defecto -->
        <input type="hidden" id="reg_rol" value="CLIENTE">

        <button type="submit" class="btn btn-custom w-100 mb-3 mt-2">
            <i class="fa-solid fa-user-plus me-2"></i> Crear mi cuenta
        </button>
    </form>

    <p class="text-muted" style="font-size: 14px;">¿Ya tienes una cuenta? <a href="login.html" class="link-custom">Inicia sesión</a></p>

    <div id="mensaje" class="mt-2 fw-bold"></div>
</div>

<script>
    const API_URL = "http://localhost:8080/api";

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const mensajeDiv = document.getElementById('mensaje');

        // Como solo pedimos nombre, email y pass, el backend necesita el resto.
        // Le pasamos datos por defecto para que no falle al guardar en base de datos.
        const usuario = {
            nombre: document.getElementById('reg_nombre').value,
            email: document.getElementById('reg_email').value,
            password: document.getElementById('reg_password').value,
            rol: "CLIENTE"
        };

        // 1. Registrar en Identity-Service (Usuarios)
        try {
            const resAuth = await fetch(`${API_URL}/auth/registro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(usuario)
            });

            if (resAuth.ok) {
                // 2. (Opcional) Registrar también en Cliente-Service para que tenga perfil
                const nuevoCliente = {
                    nombre: usuario.nombre,
                    dni: document.getElementById('reg_dni').value,
                    email: usuario.email,
                    telefono: "999999999",
                    direccion: "Dirección pendiente"
                };

                await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoCliente)
                });

                mensajeDiv.innerHTML = `<span class="text-success">¡Cuenta creada! Redirigiendo...</span>`;
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                mensajeDiv.innerHTML = `<span class="text-danger">El correo ya está registrado.</span>`;
            }
        } catch (error) {
            mensajeDiv.innerHTML = `<span class="text-danger">Error de conexión. Asegúrate de tener Docker encendido.</span>`;
        }
    });
</script>
</body>
</html>
