server:
  port: 9001

spring:
  application:
    name: cliente-service
  datasource:
    url: jdbc:postgresql://localhost:5432/vetcenter
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # ¡Esto creará la tabla solita!
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/