server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: cliente-service
          uri: lb://CLIENTE-SERVICE
          predicates:
            - Path=/api/clientes/**
        - id: mascota-service
          uri: lb://MASCOTA-SERVICE
          predicates:
            - Path=/api/mascotas/**
        - id: medicamento-service
          uri: lb://MEDICAMENTO-SERVICE
          predicates:
            - Path=/api/medicamentos/**
        - id: cita-service
          uri: lb://CITA-SERVICE
          predicates:
            - Path=/api/citas/**
        - id: producto-service
          uri: lb://PRODUCTO-SERVICE
          predicates:
            - Path=/api/productos/**
        - id: pedido-service
          uri: lb://PEDIDO-SERVICE
          predicates:
            - Path=/api/pedidos/**
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/